<title>Last Light</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: full-bleed game canvas; flame gauge and hearts on top; menus are rounded cards on a deep indigo night */
:root {
  --void: #0b0920;
  --ink: #f4eede;
  --dim: #a59fc4;
  --card: #2a2456;
  --card2: #3a3270;
  --line: #5a50a0;
  --flame: #ffc24a;
  --ember: #f08a24;
  --heart: #ff5a7a;
  --good: #7be38a;
  --display: "Fredoka", "Trebuchet MS", "Segoe UI", sans-serif;
  --mono: "VT323", "DejaVu Sans Mono", ui-monospace, Menlo, Consolas, monospace;
  --pixel: "Press Start 2P", "VT323", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--void); color: var(--ink); font-family: var(--mono); font-size: 21px; overflow: hidden; }
* { box-sizing: border-box; }
#app { position: relative; height: 100%; width: 100%; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; -webkit-touch-callout: none; }
canvas#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
button { font: inherit; color: inherit; cursor: pointer; }
img.px { image-rendering: pixelated; display: block; }

#hud { position: absolute; inset: 0; pointer-events: none; padding: calc(env(safe-area-inset-top, 0px) + 10px) max(14px, env(safe-area-inset-right, 0px)) 0 max(14px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 6px; }
#flamebar { position: relative; height: 14px; background: #241a3a; border: 2px solid var(--line); border-radius: 8px; overflow: hidden; width: min(420px, calc(100% - 52px)); }
#flamebar > i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(#ffd27a, #ff8a24); width: 70%; transition: width .15s; }
#flamebar.low > i { background: linear-gradient(#ff7a5a, #c8323a); }
#hudrow { display: flex; gap: 12px; align-items: center; font-size: 24px; text-shadow: 0 2px 0 #000; width: min(420px, calc(100% - 52px)); }
#hearts { display: flex; gap: 3px; font-size: 22px; line-height: 1; }
#hearts i { font-style: normal; color: #4a4468; } #hearts i.on { color: var(--heart); }
#coinhud { color: var(--flame); display: flex; align-items: center; gap: 4px; }
#coinhud img { width: 18px; height: 18px; }
#pips { display: flex; gap: 5px; margin-left: auto; }
#pips i { width: 12px; height: 12px; border: 2px solid #6a5a48; border-radius: 50%; }
#pips i.on { background: var(--flame); border-color: #ffe2a0; box-shadow: 0 0 8px var(--flame); }
#bossbar { width: min(420px, calc(100% - 52px)); font-size: 20px; text-shadow: 0 2px 0 #000; }
#bossbar > div { height: 12px; background: #2a1040; border: 2px solid #8a4ac0; border-radius: 8px; overflow: hidden; }
#bossbar i { display: block; height: 100%; background: linear-gradient(#d07aff, #8a3ad0); width: 100%; }
#pausebtn { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 8px); width: 38px; height: 38px; background: rgba(30, 24, 70, .8); border: 2px solid var(--line); border-radius: 10px; pointer-events: auto; font-family: var(--pixel); font-size: 12px; }
#hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); width: min(92%, 520px); text-align: center; font-size: 23px; line-height: 1.05; text-shadow: 0 2px 0 #000, 0 0 8px #000; color: #ffe2a0; pointer-events: none; text-wrap: balance; }
#banner { position: absolute; left: 50%; top: 26%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; font-family: var(--display); font-weight: 700; color: #ffd27a; font-size: clamp(34px, 9vw, 68px); line-height: 1; text-shadow: 0 4px 0 #b8501a, 0 0 22px rgba(255, 150, 60, .4); opacity: 0; transition: opacity .4s; width: 92%; text-wrap: balance; }
#banner small { display: block; font-family: var(--mono); font-weight: 400; font-size: 24px; color: #d8cfff; margin-top: 8px; text-shadow: 0 2px 0 #000; }
#banner.on { opacity: 1; }
#joy { position: absolute; width: 0; height: 0; pointer-events: none; }
#joy .base { position: absolute; left: -54px; top: -54px; width: 108px; height: 108px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, .22); background: rgba(255, 255, 255, .05); }
#joy .knob { position: absolute; left: -24px; top: -24px; width: 48px; height: 48px; border-radius: 50%; background: rgba(255, 220, 160, .3); border: 3px solid rgba(255, 220, 160, .55); }

#screen { position: absolute; inset: 0; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; background: rgba(11, 9, 32, .86); touch-action: pan-y; }
#screen.title { background: radial-gradient(ellipse at 50% 34%, rgba(255, 170, 70, .28), rgba(11, 9, 32, .97) 65%); }
.col { width: min(500px, 100%); display: flex; flex-direction: column; gap: 12px; margin: auto; }
.col.wide { width: min(760px, 100%); }
.logo { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(56px, 17vw, 112px); line-height: .92; text-align: center; text-shadow: 0 5px 0 #b8501a, 0 0 30px rgba(255, 170, 70, .5); color: #ffd27a; }
.sub { text-align: center; color: #d8cfff; font-family: var(--display); font-size: 22px; }
h2.t { margin: 0; text-align: center; font-family: var(--display); font-size: clamp(32px, 8vw, 50px); font-weight: 700; color: #ffd27a; text-shadow: 0 3px 0 #b8501a; }
h3.w { margin: 6px 0 0; font-family: var(--display); font-size: 24px; font-weight: 700; color: #d8cfff; }
.btn { background: linear-gradient(var(--card2), var(--card)); border: 2px solid var(--line); border-radius: 14px; font-family: var(--display); font-weight: 500; padding: 11px 16px; font-size: 24px; text-align: center; box-shadow: 0 4px 0 #14102e; }
.btn:hover, .btn:focus-visible { border-color: #9a90e0; outline: none; }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #14102e; }
.btn.go { background: linear-gradient(#ffc24a, #f08a24); border-color: #ffe2a0; color: #3a1a04; font-weight: 700; }
.btn.alt { background: transparent; box-shadow: none; }
.btn.gift { background: linear-gradient(#7be38a, #3aa85a); border-color: #c8ffd0; color: #0a2a12; font-weight: 700; }
.btn[disabled] { opacity: .45; cursor: default; }
.row { display: flex; gap: 10px; } .row > * { flex: 1; min-width: 0; }
.pill { text-align: center; color: var(--dim); font-size: 21px; line-height: 1.1; }
.pill b, .coins { color: var(--flame); font-weight: 400; }
.wallet { display: flex; justify-content: center; align-items: center; gap: 6px; font-size: 26px; color: var(--flame); }
.wallet img { width: 22px; height: 22px; }
.summary { display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; font-size: 24px; padding: 4px 8px; }
.summary span:nth-child(even) { text-align: right; color: var(--flame); }
.stars { text-align: center; font-size: 54px; line-height: 1; letter-spacing: 6px; color: #4a4468; }
.stars b { color: var(--flame); font-weight: 400; text-shadow: 0 0 14px rgba(255, 190, 80, .7); }
.levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.lv { aspect-ratio: 1; display: grid; place-items: center; align-content: center; gap: 2px; background: linear-gradient(var(--card2), var(--card)); border: 2px solid var(--line); border-radius: 14px; font-family: var(--display); font-weight: 700; font-size: 26px; box-shadow: 0 4px 0 #14102e; padding: 0; }
.lv small { font-family: var(--mono); font-weight: 400; font-size: 15px; letter-spacing: 1px; color: #4a4468; line-height: 1; }
.lv small b { color: var(--flame); font-weight: 400; }
.lv.next { border-color: #ffe2a0; background: linear-gradient(#ffc24a, #f08a24); color: #3a1a04; }
.lv.boss { border-color: #d07aff; }
.lv[disabled] { opacity: .4; }
.cards { display: grid; grid-template-columns: 1fr; gap: 8px; }
@media (min-width: 700px) { .cards { grid-template-columns: 1fr 1fr; } }
.card { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; text-align: left; background: linear-gradient(var(--card2), var(--card)); border: 2px solid var(--line); border-radius: 14px; padding: 8px 10px; }
.card:hover, .card:focus-visible { border-color: #ffe2a0; outline: none; }
.card .ic { width: 52px; height: 52px; background: #14102e; border-radius: 10px; display: grid; place-items: center; }
.card .ic img { width: 44px; height: 44px; }
.card h3 { margin: 0; font-family: var(--display); font-size: 21px; font-weight: 700; line-height: 1; }
.card p { margin: 2px 0 0; color: var(--dim); font-size: 18px; line-height: 1; }
.card .price { font-family: var(--display); font-weight: 700; color: var(--flame); font-size: 20px; white-space: nowrap; }
.card.cant .price { color: #8a84a8; }
.pips2 { display: flex; gap: 3px; margin-top: 4px; } .pips2 i { width: 12px; height: 5px; border-radius: 2px; background: #14102e; } .pips2 i.on { background: var(--flame); }
.story { text-align: center; font-family: var(--display); font-size: 26px; line-height: 1.2; text-wrap: balance; min-height: 4.8em; display: grid; place-items: center; }
.portrait { margin: 0 auto; width: 144px; height: 144px; display: grid; place-items: center; background: radial-gradient(circle, rgba(255, 190, 80, .35), transparent 70%); }
.portrait img { width: 108px; height: auto; }
:focus-visible { outline: 2px solid var(--flame); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { #banner, #flamebar > i { transition: none; } }
</style>

<div id="app">
  <canvas id="view"></canvas>
  <div id="hud" hidden>
    <div id="flamebar"><i id="flamefill"></i></div>
    <div id="hudrow"><span id="chlabel">Level 1</span><span id="hearts"></span><span id="coinhud"><img class="px" id="coinic" alt=""><span id="coinn">0</span></span><div id="pips"></div></div>
    <div id="bossbar" hidden><span>The Gloom King</span><div><i id="bossfill"></i></div></div>
    <button id="pausebtn" aria-label="Pause">II</button>
  </div>
  <div id="hint" hidden></div>
  <div id="joy" hidden><div class="base"></div><div class="knob" id="knob"></div></div>
  <div id="banner"></div>
  <div id="screen" hidden></div>
</div>

<script>
/*BUNDLE*/
</script>
